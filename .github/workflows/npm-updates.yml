name: NPM Updates

on:
  workflow_call:
    secrets:
      personal_access_token:
        description: 'A GitHub PAT for pushing changes to PR.'
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-updates

jobs:
  npm-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
        with:
          node-version: latest

      - name: Run npm
        run: npm ci --ignore-scripts

      - name: Create PR
        uses: peter-evans/create-pull-request@v8 # zizmor: ignore[unpinned-uses]
        with:
          token: ${{ secrets.personal_access_token }}
          delete-branch: true
          branch: node_modules
          commit-message: "node_modules: update"
          title: "node_modules: update"
